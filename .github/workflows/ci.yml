name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Check Cetacea corpus
        run: scripts/check_all.sh

      - name: Check Cetacea 2 corpus
        run: scripts/check_hol.sh

      - name: Check the sample course against the book
        run: scripts/check_course.sh

      - name: Verify the browser's course module is current
        run: python3 scripts/build_web_course.py --check

      - name: Verify the browser's book module is current
        run: python3 scripts/build_web_book.py --check

      - name: Build the browser checker
        run: cargo build -p hol_wasm --target wasm32-unknown-unknown --release

      - name: Smoke-test the browser checker
        run: node scripts/wasm_smoke.mjs
