name: Deploy browser UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build WebAssembly checkers
        run: |
          cargo build -p cetacea_wasm --target wasm32-unknown-unknown --release
          cargo build -p hol_wasm --target wasm32-unknown-unknown --release

      # The current checker is the site; the old one is kept under /v1/.
      # /v2/ was the current checker's first address, so it redirects.
      - name: Assemble site
        run: |
          mkdir -p site/pkg site/v1/pkg site/v2
          cp -r web2/. site/
          cp target/wasm32-unknown-unknown/release/hol_wasm.wasm site/pkg/
          cp -r web/. site/v1/
          cp target/wasm32-unknown-unknown/release/cetacea_wasm.wasm site/v1/pkg/
          cp scripts/pages_v2_redirect.html site/v2/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
